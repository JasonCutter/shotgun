name: ADR-118 Codemod

on:
  push:
    branches:
      - agent/adr-118-typed-failure-implementation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/adr-118-typed-failure-implementation
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply ADR-118 codemod
        run: node scripts/adr118-codemod.mjs
      - name: Install dependencies
        run: npm ci
      - name: Format changed files
        run: npm run format:write
      - name: Typecheck
        run: npm run typecheck
      - name: Run contract tests
        run: npm run test:contract
      - name: Run unit tests
        run: npm run test:unit
      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "feat: implement ADR-118 typed failure contract"
          git push origin HEAD:agent/adr-118-typed-failure-implementation
