name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  codemod:
    name: ADR-118 Codemod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/adr-118-typed-failure-implementation
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply ADR-118 codemod
        run: |
          node scripts/adr118-codemod.mjs
          node scripts/adr118-codemod-cleanup.mjs
      - name: Install dependencies
        run: npm ci
      - name: Format changed files
        run: npm run format:write
      - name: Typecheck generated implementation
        run: npm run typecheck
      - name: Run generated contract tests
        run: npm run test:contract
      - name: Run generated unit tests
        run: npm run test:unit
      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "feat: implement ADR-118 typed failure contract"
          git push origin HEAD:agent/adr-118-typed-failure-implementation

  quality:
    needs: codemod
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: shotgun
          POSTGRES_USER: shotgun
          POSTGRES_PASSWORD: shotgun
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shotgun -d shotgun"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://shotgun:shotgun@localhost:5432/shotgun
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/adr-118-typed-failure-implementation
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            adapters/document-format-python/requirements.lock
            adapters/networkx-impact-oracle/requirements.lock
      - name: Install Python dependencies
        run: >-
          python -m pip install
          -r adapters/document-format-python/requirements.lock
          -r adapters/networkx-impact-oracle/requirements.lock
      - name: Install Node.js dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check 2>&1 | tee format-check.log
      - name: Upload formatting diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: formatting-diagnostics
          path: format-check.log
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Audit dependencies
        run: npm run oss:audit
      - name: Generate SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - name: Verify SBOM JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('sbom.cdx.json', 'utf8'))"
      - name: Reset test database
        run: npm run db:reset
      - name: Run Stage 12 reuse and operations gate
        run: npm run stage12:reuse-operations-gate
      - name: Run CI test suite
        run: npm run test:ci
      - name: Run database tests
        run: npm run test:database

  frontend:
    needs: codemod
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: shotgun
          POSTGRES_USER: shotgun
          POSTGRES_PASSWORD: shotgun
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shotgun -d shotgun"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://shotgun:shotgun@localhost:5432/shotgun
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/adr-118-typed-failure-implementation
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Node.js dependencies
        run: npm ci
      - name: Typecheck frontend
        run: npm run frontend:typecheck
      - name: Test frontend
        run: npm run frontend:test
      - name: Build frontend
        run: npm run frontend:build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Reset frontend test database
        run: npm run db:reset
      - name: Run frontend end-to-end tests
        run: npm run frontend:test:e2e

  required-gates:
    name: Required Gates
    if: always()
    needs: [codemod, quality, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs succeeded
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
