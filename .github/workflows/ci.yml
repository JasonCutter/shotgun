name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shotgun
          POSTGRES_USER: shotgun
          POSTGRES_PASSWORD: shotgun
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shotgun -d shotgun"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://shotgun:shotgun@localhost:5432/shotgun
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:reset
      - run: npm run check
      - run: npm run test:database
      - run: npm run db:verify
