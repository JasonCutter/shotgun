name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: shotgun
          POSTGRES_USER: shotgun
          POSTGRES_PASSWORD: shotgun
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shotgun -d shotgun"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://shotgun:shotgun@localhost:5432/shotgun
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: adapters/document-format-python/requirements.lock
      - run: python -m pip install -r adapters/document-format-python/requirements.lock
      - run: npm ci
      - run: npm run oss:audit
      - run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - run: node -e "JSON.parse(require('node:fs').readFileSync('sbom.cdx.json', 'utf8'))"
      - run: npm run db:reset
      - run: npm run check
      - run: npm run test:database
      - run: npm run db:verify
