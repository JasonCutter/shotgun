services:
  db:
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: shotgun
      POSTGRES_USER: shotgun
      POSTGRES_PASSWORD: shotgun
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shotgun -d shotgun']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - shotgun-postgres:/var/lib/postgresql/data

  db-test:
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: shotgun_test
      POSTGRES_USER: shotgun
      POSTGRES_PASSWORD: shotgun
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shotgun -d shotgun_test']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shotgun-postgres:
